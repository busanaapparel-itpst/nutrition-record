<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Nutrition Record</title>
<meta name="theme-color" content="#0f5c6e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nutrition">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root { --bg:#eef2f4; --card:#fff; --ink:#1c2b33; --muted:#5d7079; --line:#c9d4d9; --accent:#0f5c6e; --accent-dark:#0b4756; --danger:#a33a3a; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust:100%; scroll-padding-top:12px; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-tap-highlight-color:transparent; }
  main { max-width:640px; margin:0 auto; padding:calc(20px + env(safe-area-inset-top)) 14px 24px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.sub { margin:0 0 20px; color:var(--muted); font-size:.95rem; }
  fieldset { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 14px 6px; margin:0 0 16px; min-width:0; }
  legend { font-weight:700; font-size:1.1rem; padding:0 8px; color:var(--accent); }
  label { display:block; font-weight:600; margin:0 0 4px; font-size:.95rem; }
  .field { margin-bottom:14px; }
  input { width:100%; min-height:46px; padding:10px 12px; font:inherit; font-size:16px; color:inherit; border:1px solid var(--line); border-radius:8px; background:#fff; min-width:0; }
  input:focus, button:focus-visible { outline:3px solid #7cc4d4; outline-offset:1px; border-color:var(--accent); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .cat { border-top:1px solid var(--line); padding:14px 0 4px; }
  .cat:first-of-type { border-top:0; padding-top:2px; }
  .cat h3 { margin:0 0 10px; font-size:1rem; display:flex; align-items:center; gap:10px; }
  .ico { display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:10px; font-size:1.3rem; line-height:1; flex:none; background:var(--tint,#e6f0f2); }
  legend .ico { width:32px; height:32px; font-size:1.15rem; margin-right:6px; vertical-align:middle; border-radius:50%; }
  .meal-sum .ico { width:28px; height:28px; font-size:1rem; margin-right:8px; border-radius:50%; background:#fff; }
  .meal-sum { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:6px -14px 0; padding:12px 14px; background:#e6f0f2; border-top:1px solid var(--line); border-radius:0 0 11px 11px; font-weight:700; }
  .meal-sum b { color:var(--accent); font-size:1.05rem; }
  .item { display:grid; grid-template-columns:1fr 140px 46px; gap:8px; margin-bottom:8px; }
  .price { position:relative; }
  .price span { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:.9rem; pointer-events:none; }
  .price input { padding-left:38px; }
  .rm { min-height:46px; border:1px solid var(--line); background:#fff; color:var(--danger); border-radius:8px; cursor:pointer; font-size:1.4rem; line-height:1; padding:0; }
  .rm-space { visibility:hidden; }
  .add { width:100%; min-height:44px; margin:2px 0 10px; background:#f3f8f9; border:1px dashed var(--accent); color:var(--accent); border-radius:8px; font:inherit; font-weight:600; cursor:pointer; }
  .add:active, .rm:active { transform:scale(.98); }
  .note { margin:4px 0 16px; font-size:.85rem; color:var(--muted); text-align:center; }
  .bar { position:sticky; bottom:0; z-index:5; background:var(--card); border-top:1px solid var(--line); box-shadow:0 -4px 12px rgba(0,0,0,.06); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); }
  .bar-in { max-width:640px; margin:0 auto; display:flex; align-items:center; gap:12px; }
  .sum { flex:1; line-height:1.2; }
  .sum small { display:block; color:var(--muted); font-size:.8rem; }
  .sum b { font-size:1.1rem; }
  .submit { flex:0 0 auto; min-height:48px; padding:0 22px; font:inherit; font-weight:700; color:#fff; background:var(--accent); border:0; border-radius:10px; cursor:pointer; }
  .submit:active { background:var(--accent-dark); }
  @media (max-width:520px){
    .row { grid-template-columns:1fr; gap:0; }
    .item { grid-template-columns:1fr 1fr; grid-template-areas:"n n" "p r"; }
    .item .iname { grid-area:n; }
    .item .price { grid-area:p; }
    .item .rm, .item .rm-space { grid-area:r; }
    .item .rm { font-size:1rem; font-weight:600; }
    .item { padding-bottom:6px; }
    .item:not(:last-child) { border-bottom:1px dotted var(--line); margin-bottom:10px; padding-bottom:10px; }
    .item .rm-space { display:none; }
    .item:has(.rm-space) .price { grid-column:1 / -1; }
  }
</style>
</head>
<body>
<form id="form">
<main>
  <h1>Daily Nutrition Record</h1>
  <p class="sub">Setiap kategori wajib memiliki minimal satu item. Ketuk “Tambah item” untuk menambah item lain.</p>

  <fieldset>
    <legend>Informasi umum</legend>
    <div class="row">
      <div class="field">
        <label for="nama">Nama</label>
        <input id="nama" required autocomplete="name" enterkeyhint="next">
      </div>
      <div class="field">
        <label for="tanggal">Tanggal</label>
        <input id="tanggal" type="date" required>
      </div>
    </div>
  </fieldset>

  <div id="meals"></div>
  <p class="note">Data hanya diproses di perangkat Anda dan tidak dikirim ke mana pun.</p>
</main>

<div class="bar">
  <div class="bar-in">
    <div class="sum"><small>Total hari ini</small><b id="grand">Rp 0</b></div>
    <button class="submit" type="submit">Generate Data</button>
  </div>
</div>
</form>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
var MEALS = ["Sarapan", "Makan siang", "Makan malam"];
var CATS = ["Protein", "Serat/Sayuran", "Biji-bijian", "Buah/Vitamin"];
var MEAL_ICONS = ["\uD83C\uDF73", "\u2600\uFE0F", "\uD83C\uDF19"];
var CAT_ICONS = ["\uD83E\uDD69", "\uD83E\uDD66", "\uD83C\uDF3E", "\uD83C\uDF4E"];
var CAT_TINTS = ["#fde4e0", "#dff1dc", "#faefcf", "#fde3ec"];
var rp = function (n) { return "Rp " + Math.round(n).toLocaleString("id-ID"); };

document.getElementById("tanggal").valueAsDate = new Date();

function itemRow(first) {
  return '<div class="item">' +
    '<input class="iname" required enterkeyhint="next" autocomplete="off" placeholder="Nama item, mis. telur rebus" aria-label="Nama item">' +
    '<div class="price"><span>Rp</span><input class="iprice" type="number" min="0" step="any" required inputmode="numeric" enterkeyhint="done" placeholder="0" aria-label="Harga"></div>' +
    (first ? '<span class="rm-space"></span>' : '<button type="button" class="rm" aria-label="Hapus item">&times;</button>') +
    '</div>';
}

var html = "";
MEALS.forEach(function (m, i) {
  html += '<fieldset data-meal="' + i + '"><legend><span class="ico" aria-hidden="true">' + MEAL_ICONS[i] + '</span>' + m + '</legend>';
  CATS.forEach(function (c, j) {
    html += '<div class="cat" data-cat="' + j + '"><h3><span class="ico" aria-hidden="true" style="--tint:' + CAT_TINTS[j] + '">' + CAT_ICONS[j] + '</span>' + c + '</h3><div class="items">' + itemRow(true) +
            '</div><button type="button" class="add">+ Tambah item</button></div>';
  });
  html += '<div class="meal-sum"><span><span class="ico" aria-hidden="true">' + MEAL_ICONS[i] + '</span>Subtotal ' + m + '</span><b class="sub-m">Rp 0</b></div></fieldset>';
});
document.getElementById("meals").innerHTML = html;

var form = document.getElementById("form");

form.addEventListener("click", function (e) {
  if (e.target.classList.contains("add")) {
    var box = e.target.parentNode.querySelector(".items");
    box.insertAdjacentHTML("beforeend", itemRow(false));
    box.lastChild.querySelector(".iname").focus();
  } else if (e.target.classList.contains("rm")) {
    e.target.closest(".item").remove();
    updateTotal();
  }
});
form.addEventListener("input", updateTotal);

function collect() {
  return MEALS.map(function (m, i) {
    var fs = form.querySelector('fieldset[data-meal="' + i + '"]');
    return { name: m, el: fs, cats: CATS.map(function (c, j) {
      var cat = fs.querySelector('.cat[data-cat="' + j + '"]');
      var items = [].map.call(cat.querySelectorAll(".item"), function (it) {
        return { name: it.querySelector(".iname").value.trim(), price: parseFloat(it.querySelector(".iprice").value) || 0 };
      });
      return { name: c, items: items, el: cat, sum: items.reduce(function (s, x) { return s + x.price; }, 0) };
    }) };
  });
}
function updateTotal() {
  var t = 0;
  collect().forEach(function (m) {
    var ms = 0;
    m.cats.forEach(function (c) { ms += c.sum; });
    m.el.querySelector(".sub-m").textContent = rp(ms);
    t += ms;
  });
  document.getElementById("grand").textContent = rp(t);
}

form.addEventListener("submit", function (e) {
  e.preventDefault();
  if (!window.jspdf) { alert("Library PDF belum termuat. Periksa koneksi internet lalu coba lagi."); return; }
  var data = collect();
  var doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
  var left = 20, width = 170, right = left + width, y = 25;
  var nama = document.getElementById("nama").value.trim();
  var tgl = document.getElementById("tanggal").value;
  var tglText = new Date(tgl + "T00:00:00").toLocaleDateString("id-ID",
    { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  var grand = 0;

  function room(h) { if (y + h > 280) { doc.addPage(); y = 25; } }

  doc.setFont("helvetica", "bold"); doc.setFontSize(20);
  doc.text("Daily Nutrition Record", left, y); y += 9;
  doc.setFont("helvetica", "normal"); doc.setFontSize(11);
  doc.text("Nama: " + nama, left, y); y += 6;
  doc.text("Tanggal: " + tglText, left, y); y += 5;
  doc.setDrawColor(180); doc.line(left, y, right, y); y += 9;

  data.forEach(function (m) {
    var mealSum = 0;
    room(30);
    doc.setFillColor(15, 92, 110); doc.rect(left, y - 5, width, 8, "F");
    doc.setTextColor(255); doc.setFont("helvetica", "bold"); doc.setFontSize(12);
    doc.text(m.name, left + 3, y + 0.6);
    y += 9;
    doc.setTextColor(0);

    m.cats.forEach(function (c) {
      mealSum += c.sum;
      room(16);
      doc.setFont("helvetica", "bold"); doc.setFontSize(10.5);
      doc.text(c.name, left + 3, y);
      y += 5.5;
      doc.setFont("helvetica", "normal"); doc.setFontSize(10.5);
      c.items.forEach(function (it) {
        var lines = doc.splitTextToSize(it.name, 115);
        room(lines.length * 5 + 2);
        doc.text("\u2022", left + 6, y);
        doc.text(lines, left + 10, y);
        doc.text(rp(it.price), right - 2, y, { align: "right" });
        y += lines.length * 5 + 1;
      });
      y += 1.5;
      doc.setDrawColor(225); doc.line(left, y - 3, right, y - 3);
    });

    grand += mealSum;
    room(10);
    doc.setFont("helvetica", "bold"); doc.setFontSize(11);
    doc.text("Subtotal " + m.name, left + 3, y + 1);
    doc.text(rp(mealSum), right - 2, y + 1, { align: "right" });
    y += 11;
  });

  room(14);
  doc.setDrawColor(15, 92, 110); doc.setLineWidth(0.6); doc.line(left, y - 4, right, y - 4);
  doc.setFont("helvetica", "bold"); doc.setFontSize(13);
  doc.text("Total hari ini", left + 3, y + 3);
  doc.text(rp(grand), right - 2, y + 3, { align: "right" });

  var safe = nama.replace(/[^\w\-]+/g, "_") || "data";
  doc.save("daily-nutrition-record-" + safe + "-" + tgl + ".pdf");
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
</body>
</html>
